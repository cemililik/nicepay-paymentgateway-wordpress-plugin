name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/tests.yml

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: '8.2'
          coverage: none

      - name: Extract and validate tag version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node .github/scripts/check-version.js "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog.txt"
          test -s "$RUNNER_TEMP/changelog.txt"

      - name: Build plugin ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/build-release.sh "$VERSION" "nicepay-payment-gateway-${VERSION}.zip"

      - name: Smoke-check plugin ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/smoke-check-artifact.sh "nicepay-payment-gateway-${VERSION}.zip"

      - name: Generate SHA-256 checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sha256sum "nicepay-payment-gateway-${VERSION}.zip" > "nicepay-payment-gateway-${VERSION}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/changelog.txt
          files: |
            nicepay-payment-gateway-${{ steps.version.outputs.version }}.zip
            nicepay-payment-gateway-${{ steps.version.outputs.version }}.zip.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
