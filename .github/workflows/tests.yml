name: Tests

on:
  workflow_call:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, hash, curl
          coverage: ${{ matrix.php == '8.2' && 'xdebug' || 'none' }}
          tools: composer:v2

      - name: Validate Composer metadata and lock file
        run: composer validate --strict --no-check-publish

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
            ${{ runner.os }}-composer-

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: composer test

      - name: Run tests with coverage
        if: matrix.php == '8.2'
        run: composer test-coverage

      - name: Upload coverage report
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: tests/coverage/
          if-no-files-found: error
          retention-days: 5

  lint:
    name: Syntax and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata and lock file
        run: composer validate --strict --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Install locked JavaScript tooling
        run: npm ci --ignore-scripts

      - name: Audit locked JavaScript dependencies
        run: npm audit --audit-level=high --ignore-scripts

      - name: Install translation verification tooling
        run: sudo apt-get update && sudo apt-get install --yes gettext

      - name: Run JavaScript lint and DOM tests
        run: npm run quality

      - name: Verify translation source and catalogs
        run: bash .github/scripts/check-translations.sh

      - name: Check PHP and release metadata
        run: composer quality

  database-integration:
    name: WordPress and MariaDB schema integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run disposable schema and migration matrix
        run: bash tests/integration/run-schema-migration.sh

  woocommerce-integration:
    name: WooCommerce legacy and HPOS smoke integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run disposable WooCommerce storage matrix
        run: bash tests/integration/run-woocommerce-smoke.sh

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, lint, database-integration, woocommerce-integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: '8.2'
          coverage: none

      - name: Resolve plugin version
        id: version
        run: |
          version="$(node -e "const fs=require('fs');const m=fs.readFileSync('nicepay-payment-gateway.php','utf8').match(/^\\s*\\*\\s*Version:\\s*([^\\s]+)/m);if(!m)process.exit(1);process.stdout.write(m[1]);")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build plugin artifact
        run: bash .github/scripts/build-release.sh "${{ steps.version.outputs.version }}" build/nicepay-payment-gateway.zip

      - name: Verify reproducible build
        run: |
          bash .github/scripts/build-release.sh "${{ steps.version.outputs.version }}" build/nicepay-payment-gateway.repro.zip
          cmp build/nicepay-payment-gateway.zip build/nicepay-payment-gateway.repro.zip

      - name: Smoke-check plugin artifact
        run: bash .github/scripts/smoke-check-artifact.sh build/nicepay-payment-gateway.zip
